<style>
  :root {
    --bg: #100610;
    --fg: #fff5fa;
    --muted: #d6b8c8;
    --pink: #ff4fa3;
    --pink-soft: #ff8ec7;
    --pink-deep: #c81f73;
    --lilac: #c084fc;
    --gold: #ffd6a5;
    --glass: rgba(255, 200, 225, 0.07);
    --glass-strong: rgba(255, 200, 225, 0.13);
    --border: rgba(255, 180, 215, 0.18);
    --shadow-pink: 0 12px 40px -10px rgba(255, 79, 163, 0.55);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    min-height: 100dvh;
    color: var(--fg);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    background:
      radial-gradient(1000px 600px at 50% -10%, rgba(255, 142, 199, 0.28), transparent 60%),
      radial-gradient(900px 500px at 20% 110%, rgba(192, 132, 252, 0.18), transparent 60%),
      radial-gradient(700px 400px at 90% 80%, rgba(255, 79, 163, 0.18), transparent 65%),
      linear-gradient(180deg, #120710 0%, #1a0a1c 100%);
    display: flex;
    justify-content: center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    overflow-x: hidden;
  }

  .sparkle {
    position: fixed;
    pointer-events: none;
    color: var(--pink-soft);
    opacity: 0.6;
    font-size: 14px;
    animation: float 6s ease-in-out infinite;
    z-index: 0;
  }
  .sparkle.s1 { top: 12%; left: 8%; }
  .sparkle.s2 { top: 22%; right: 10%; animation-delay: 1.5s; font-size: 18px; color: var(--gold); }
  .sparkle.s3 { top: 60%; left: 6%; animation-delay: 3s; font-size: 12px; color: var(--lilac); }
  .sparkle.s4 { top: 75%; right: 12%; animation-delay: 0.8s; }
  .sparkle.s5 { top: 40%; right: 6%; animation-delay: 2.2s; font-size: 10px; }
  .sparkle.s6 { top: 88%; left: 14%; animation-delay: 4s; font-size: 16px; color: var(--gold); }

  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.5; }
    50% { transform: translateY(-12px) rotate(15deg); opacity: 0.95; }
  }

  main {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 440px;
    padding: 48px 22px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .avatar-wrap {
    position: relative;
    width: 128px;
    height: 128px;
    margin-bottom: 22px;
  }

  .avatar-wrap::before {
    content: "";
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, var(--pink), var(--lilac), var(--gold), var(--pink-soft), var(--pink));
    filter: blur(8px);
    opacity: 0.7;
    animation: spin 8s linear infinite;
    z-index: 0;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .avatar {
    position: relative;
    z-index: 1;
    width: 128px;
    height: 128px;
    border-radius: 50%;
    background: linear-gradient(135deg, #2a1424, #1a0a1c);
    display: grid;
    place-items: center;
    color: var(--pink-soft);
    font-family: "Dancing Script", cursive;
    font-weight: 700;
    font-size: 64px;
    border: 2px solid rgba(255, 255, 255, 0.15);
    box-shadow:
      0 0 0 3px rgba(255, 79, 163, 0.35),
      0 0 50px rgba(255, 79, 163, 0.4),
      inset 0 0 30px rgba(255, 142, 199, 0.15);
    overflow: hidden;
  }

  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

  h1 {
    margin: 4px 0 2px;
    font-family: "Dancing Script", "Brush Script MT", cursive;
    font-size: 44px;
    font-weight: 700;
    letter-spacing: 0.5px;
    background: linear-gradient(135deg, #fff 0%, var(--pink-soft) 50%, var(--pink) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 2px 30px rgba(255, 79, 163, 0.3);
  }

  .handle {
    color: var(--pink-soft);
    font-size: 13px;
    margin-bottom: 16px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    font-weight: 600;
  }
  .handle::before, .handle::after {
    content: "·";
    margin: 0 10px;
    color: var(--pink);
    opacity: 0.6;
  }

  .bio {
    color: var(--muted);
    font-size: 15px;
    line-height: 1.55;
    max-width: 32ch;
    margin: 0 0 26px;
  }

  .links {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* All buttons */
  .btn {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 16px 18px;
    border-radius: 16px;
    font-size: 14.5px;
    font-weight: 600;
    letter-spacing: 0.3px;
    text-decoration: none;
    color: var(--fg);
    background: var(--glass);
    border: 1px solid var(--border);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    transition: transform 0.2s ease, background 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    -webkit-tap-highlight-color: transparent;
    cursor: pointer;
    overflow: hidden;
    font-family: inherit;
  }

  .btn:hover, .btn:focus-visible {
    background: var(--glass-strong);
    border-color: rgba(255, 180, 215, 0.32);
    transform: translateY(-2px);
    box-shadow: 0 8px 24px -10px rgba(255, 79, 163, 0.35);
    outline: none;
  }
  .btn:active { transform: translateY(0); }

  .btn svg { width: 18px; height: 18px; flex: 0 0 18px; }

  /* VIP — dominant CTA */
  .btn--vip {
    padding: 20px 22px;
    border-radius: 20px;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.6px;
    background: linear-gradient(115deg, #ff4fa3, #ff8ec7, #c084fc, #ff4fa3);
    background-size: 300% 100%;
    animation: shimmer 6s ease infinite;
    border-color: transparent;
    color: #fff;
    box-shadow: var(--shadow-pink), 0 0 0 1px rgba(255, 255, 255, 0.12) inset;
    margin-bottom: 4px;
  }

  @keyframes shimmer {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  .btn--vip:hover, .btn--vip:focus-visible {
    box-shadow: 0 18px 44px -12px rgba(255, 79, 163, 0.75), 0 0 0 1px rgba(255, 255, 255, 0.2) inset;
    transform: translateY(-2px);
  }

  .btn--vip .vip-badge {
    background: rgba(255, 255, 255, 0.22);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 3px 8px;
    border-radius: 999px;
    margin-left: 4px;
  }

  .vip-sub {
    font-size: 11.5px;
    color: var(--pink-soft);
    margin: -2px 0 8px;
    letter-spacing: 0.4px;
    opacity: 0.85;
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--pink);
    opacity: 0.4;
    margin: 14px 0 10px;
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    width: 100%;
  }
  .divider::before, .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--pink), transparent);
  }

  footer {
    margin-top: 30px;
    color: var(--muted);
    font-size: 11px;
    opacity: 0.55;
    letter-spacing: 1px;
  }
  footer .heart {
    color: var(--pink);
    display: inline-block;
    animation: beat 1.6s ease-in-out infinite;
  }
  @keyframes beat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.2); }
  }

  /* Age gate modal */
  .gate {
    position: fixed;
    inset: 0;
    background: rgba(10, 4, 10, 0.78);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 100;
    animation: fadeIn 0.25s ease;
  }
  .gate.open { display: flex; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .gate-card {
    width: 100%;
    max-width: 380px;
    background: linear-gradient(180deg, #1f0d1b, #150810);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 28px 24px;
    text-align: center;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), 0 0 60px rgba(255, 79, 163, 0.25);
    animation: pop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes pop {
    from { transform: scale(0.9); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .gate-card h2 {
    margin: 8px 0 4px;
    font-family: "Dancing Script", cursive;
    font-size: 34px;
    background: linear-gradient(135deg, #fff, var(--pink));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .gate-card p {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.5;
    margin: 0 0 22px;
  }
  .gate-actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .gate-yes {
    padding: 16px;
    border-radius: 14px;
    border: none;
    background: linear-gradient(115deg, #ff4fa3, #c084fc);
    color: #fff;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.5px;
    cursor: pointer;
    font-family: inherit;
    box-shadow: var(--shadow-pink);
    transition: transform 0.15s ease;
  }
  .gate-yes:hover { transform: translateY(-1px); }
  .gate-no {
    padding: 14px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-weight: 500;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
  }
  .gate-no:hover { color: var(--fg); }
  .gate-fine {
    font-size: 10.5px;
    color: var(--muted);
    opacity: 0.55;
    margin-top: 14px;
    line-height: 1.4;
  }

  @media (min-width: 480px) {
    main { padding-top: 64px; }
    h1 { font-size: 50px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .avatar-wrap::before, .btn--vip, .sparkle, .heart, .gate, .gate-card { animation: none; }
    .btn { transition: none; }
  }
</style>
</head>
